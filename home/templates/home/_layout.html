<!DOCTYPE html>{% load static %}
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}{% endblock %}</title>

    <link rel="shortcut icon" href="https://i.ibb.co/ftqqKP6/Renan-Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/sistemasBeta.css' %}">
    <link rel="stylesheet" href="{% static 'css/curriculum.css' %}">
</head>
<body class="theme-dark">

<div class="page-frame">
    <header class="bc-nav">
        <div class="nav-shell">
            <div class="brand">
                <img src="https://i.ibb.co/ftqqKP6/Renan-Logo.png" width="42" height="42" alt="Bodom Creed Logo">
                <div class="brand-text">
                    <span class="brand-name">Bodom Creed</span>
                </div>
            </div>
            <nav class="nav-links">
                <a href="/">Início</a>
                <a href="/sistemasBeta/">Projetos</a>
                <a href="/#sobre">Sobre</a>
            </nav>
        </div>
    </header>

    <main class="content-shell">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-shell">
            <div class="footer-brand">
                <img src="https://i.ibb.co/ftqqKP6/Renan-Logo.png" width="36" height="36" alt="Bodom Creed Logo">
                <div>
                    <div class="brand-name">Bodom Creed</div>
                    <div class="brand-sub">Criado no Brasil</div>
                </div>
            </div>
            <div class="footer-meta">
                <span>© <span id="currentYear"></span> </span>
                <span>Desenvolvido por Renan</span>
            </div>
        </div>
    </footer>
</div>

<script src="https://kit.fontawesome.com/5d1f006dd0.js" crossorigin="anonymous"></script>
<script src="{% static 'js/scripts.js' %}"></script>
<script src="{% static 'js/curriculum.js' %}"></script>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>

</body>
</html>
